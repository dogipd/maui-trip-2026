<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maui 7-Night Birthday Master Plan | Dheeraj & Bindu</title>
  <style>
    :root {
      --primary: #0e6476;
      --primary-dark: #083d49;
      --accent: #d97736;
      --accent-light: #fef3eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --success-light: #dcfce7;
      --warning: #eab308;
      --tag-blue-bg: #e0f2fe;
      --tag-blue-text: #0369a1;
      --tag-purple-bg: #f3e8ff;
      --tag-purple-text: #7e22ce;
      --tag-green-bg: #dcfce7;
      --tag-green-text: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background-color: var(--bg);
      padding: 20px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 32px 28px;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(14, 100, 118, 0.2);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #e2e8f0;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      text-align: center;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.5);
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .tab-pane {
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    .tab-pane.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
