<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maui Vacation Master Guide & Itinerary</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #f0fdfa;
      --accent: #f97316;
      --accent-light: #fff7ed;
      --xplorie-purple: #6366f1;
      --xplorie-bg: #eef2ff;
      --xplorie-border: #c7d2fe;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --warning: #fef3c7;
      --warning-border: #fcd34d;
      --warning-text: #92400e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      color: white;
      padding: 32px 24px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.25);
    }

    header h1 { font-size: 28px; margin-bottom: 6px; font-weight: 800; letter-spacing: -0.5px; }
    header p { color: #99f6e4; font-size: 14px; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    button.action-btn {
      background-color: white;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    button.action-btn:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .status-badge { font-size: 13px; color: var(--text-muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
    }

    .card h2 {
      font-size: 18px;
      color: var(--primary-dark);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .badge-xplorie {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    }

    .xplorie-highlight-box {
      background-color: var(--xplorie-bg);
      border-left: 4px solid var(--xplorie-purple);
      border-radius: 8px;
      padding: 14px 18px;
      margin: 14px 0;
      color: #312e81;
      font-size: 13.5px;
    }

    .xplorie-highlight-box strong {
      color: #1e1b4b;
    }

    .callout-box {
      background-color: var(--warning);
      border-left: 4px solid var(--warning-border);
      color: var(--warning-text);
      padding: 12px 16px;
      border-radius: 8px;
      margin: 12px 0;
      font-size: 13.5px;
    }

    .callout-box strong { color: #78350f; }

    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .checklist-section h3 {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .checklist { list-style: none; }

    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .checklist input[type="checkbox"] {
      margin-top: 4px;
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .timeline { list-style: none; padding-left: 4px; }

    .timeline li {
      position: relative;
      padding-left: 22px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .timeline li.xplorie-stop::before {
      background: var(--xplorie-purple);
      box-shadow: 0 0 0 3px #c7d2fe;
    }

    .timeline li strong { color: var(--text); font-weight: 700; }

    .day-meta {
      display: flex;
      gap: 14px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--primary-light);
      border-radius: 8px;
      font-size: 13px;
      color: var(--primary-dark);
      flex-wrap: wrap;
    }

    [contenteditable="true"]:hover {
      outline: 2px dashed #93c5fd;
      border-radius: 4px;
      cursor: text;
    }

    [contenteditable="true"]:focus {
      outline: 2px solid var(--primary);
      background-color: #f0fdfa;
      border-radius: 4px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    @media print {
      body { background: white; padding: 0; }
      .nav-tabs, .toolbar, button { display: none !important; }
      .tab-content { display: block !important; }
      .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
      header { background: #0f766e; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

    <header>
      <h1 contenteditable="true">🌴 Maui Vacation Master Plan</h1>
      <p contenteditable="true">October 25 – October 31, 2026 | Basecamp: Menehune Shores #421 (North Kihei)</p>
    </header>

    <div class="nav-tabs">

      <button class="tab-btn" onclick="switchTab('xplorie', this)">🎟️ Xplorie Pass Hub</button>
      <button class="tab-btn" onclick="switchTab('reminders', this)">⏰ Booking Milestones</button>
      <button class="tab-btn" onclick="switchTab('packing', this)">🧳 Packing & Gear Lists</button>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button class="action-btn" onclick="window.print()">🖨️ Print / Save PDF</button>
        <button class="action-btn" onclick="shareTrip()">🔗 Copy Share Link</button>
        <button class="action-btn" onclick="resetDefaults()">🔄 Reset Defaults</button>
      </div>
      <span class="status-badge" id="saveIndicator">💡 Click any text to edit directly</span>
    </div>
